[Unit]
Wants=network-online.target tailscaled.service
After=network-online.target tailscaled.service

[Service]
ExecStart=
ExecStart=/usr/bin/prometheus-node-exporter --web.listen-address=100.99.26.96:9100
ExecStartPre=/bin/sh -c 'for i in $(seq 1 60); do ip -4 addr show dev tailscale0 | grep -q 100.99.26.96 && exit 0; sleep 1; done; exit 1'
Restart=on-failure
RestartSec=10s
