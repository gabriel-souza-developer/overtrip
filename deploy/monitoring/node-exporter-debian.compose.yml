services:
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.9.0
    container_name: overtrip-node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --web.listen-address=100.111.0.47:9100
